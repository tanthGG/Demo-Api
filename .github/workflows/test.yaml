name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
    - name: Hello world action
      run: echo "Hello world"

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Build
      run: CGO_ENABLED=0 GOOS=linux go build -o demo-deploy-api .

    - name: Test
      run: go test -v ./...
